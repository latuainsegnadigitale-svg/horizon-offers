<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horizon Offers</title>
<meta name="description" content="Horizon Offers: le offerte BASE, STANDARD e PLUS per le insegne LED, in collaborazione con JSE Insegne Digitali.">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1D0718">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Horizon Offers">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Open+Sans:wght@400;800&display=swap" rel="stylesheet">
<style>
/* Horizon Offers: stile Horizon (nero-prugna, viola). JSE compare come partner e sugli schermi. Banco del venditore → palco per il cliente. */
:root{
  --ink:#050102; --plum:#34012C; --plum-2:#1D0718; --plum-3:#12040F;
  --violet:#6D40A3; --violet-hi:#A47FDD; --violet-glow:rgba(109,64,163,.38);
  --on-white:#2A0524; --sheet:#1D0718;
  --glass:rgba(255,255,255,.045); --glass-2:rgba(255,255,255,.08); --line:rgba(255,255,255,.12); --line-strong:rgba(255,255,255,.3);
  --fg:#FFFFFF; --dim:rgba(255,255,255,.68); --faint:rgba(255,255,255,.46);
  --strike:#E2262F;
  --ok:#7FE0A2; --warn:#FFC874;
  --f-display:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-body:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-brand:"Open Sans","Instrument Sans","Segoe UI",sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;}
html{background:var(--ink);}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(to top right,#34012C 0%,#1D0718 42%,#0A0208 74%,#050102 100%);}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.3px);background-size:7px 7px;}
body{margin:0;min-height:100vh;background:transparent;color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button,input{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--violet-hi);outline-offset:3px;border-radius:6px;}
::selection{background:rgba(164,127,221,.4);}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:20px 40px;}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* testata */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;}
.top .logo{height:40px;width:auto;display:block;}
.tbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-weight:600;font-size:.92rem;transition:transform 160ms var(--ease-out),background-color 150ms ease,border-color 150ms ease;}
.tbtn:hover{border-color:var(--line-strong);}
.tbtn:active{transform:scale(.97);}
.tbtn.solid{background:#fff;color:var(--on-white);border-color:#fff;}
.tbtn svg{width:18px;height:18px;flex:none;}

/* home */
.hero{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-block:30px 36px;overflow-x:clip;}
.hero::before{content:"";position:absolute;z-index:-1;left:50%;bottom:-70px;width:100%;height:280px;transform:translateX(-50%);background:radial-gradient(closest-side,var(--violet-glow),transparent);pointer-events:none;}
.lockup{display:inline-flex;align-items:center;gap:.32em;margin:0;font-family:var(--f-brand);font-size:clamp(2.3rem,8.4vw,3.9rem);line-height:.94;color:#fff;}
.lockup .wm{display:flex;flex-direction:column;align-items:flex-end;}
.lockup .wm b{font-weight:800;letter-spacing:-.005em;}
.lockup .wm span{font-weight:400;letter-spacing:.015em;}
.lockup img{height:1.9em;width:auto;display:block;}
.rule{width:min(420px,80%);height:1px;background:linear-gradient(90deg,transparent,rgba(164,127,221,.7),transparent);}
.collab{display:inline-flex;align-items:center;gap:12px;padding:7px 16px 7px 18px;border-radius:999px;border:1px solid var(--line);background:var(--glass);}
.collab span{font-size:.74rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);}
.collab img{height:40px;width:auto;display:block;}
.hero p{margin:0;color:var(--dim);max-width:46ch;}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px;}
.sec-title h2{font-size:1.1rem;font-weight:600;}
.sec-title small{color:var(--faint);font-size:.85rem;}
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;}
.size-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 18px 22px;border-radius:22px;border:1.5px solid var(--line);background:radial-gradient(110% 70% at 50% 0%,rgba(109,64,163,.18),transparent 70%),var(--glass);text-align:center;transition:transform 160ms var(--ease-out),border-color 150ms ease;}
.size-card:hover{border-color:var(--line-strong);}
.size-card:active{transform:scale(.98);}
.size-card .stage{height:150px;display:flex;align-items:flex-end;justify-content:center;}
.size-card strong{font-family:var(--f-display);font-size:1.7rem;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
.size-card strong span{font-size:.95rem;font-weight:500;color:var(--dim);margin-left:4px;}
.size-card .from{color:var(--dim);font-size:.9rem;}
.size-card .from b{color:#fff;font-weight:600;}
.custom-card{margin-top:16px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;width:100%;padding:20px 22px;border-radius:22px;border:1.5px dashed var(--line-strong);background:transparent;text-align:left;transition:transform 160ms var(--ease-out),background-color 150ms ease;}
.custom-card:hover{background:var(--glass);}
.custom-card:active{transform:scale(.99);}
.custom-card .plus{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:#fff;color:var(--on-white);}
.custom-card .plus svg{width:24px;height:24px;}
.custom-card h3{font-size:1.12rem;font-weight:600;}
.custom-card p{margin:2px 0 0;color:var(--dim);font-size:.92rem;}
.custom-card .go{width:22px;height:22px;opacity:.8;}
.saved{margin-top:34px;}
.saved-list{list-style:none;margin:0;padding:0;display:grid;gap:10px;}
.saved-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);}
.saved-item .meta{min-width:0;}
.saved-item strong{display:block;font-weight:600;}
.saved-item small{color:var(--dim);}
.saved-item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.mini-btn{min-height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:.86rem;font-weight:600;}
.mini-btn:hover{border-color:var(--line-strong);}
.mini-btn.danger{color:#FFB3B8;}
.note{color:var(--faint);font-size:.82rem;margin-top:10px;}

/* schermo disegnato */
.screen{position:relative;display:inline-block;isolation:isolate;}
.screen .bezel.back{position:absolute;left:0;top:0;z-index:-1;transform:translate(-30%,-12%);box-shadow:0 0 0 1.5px rgba(164,127,221,.8),0 0 18px rgba(109,64,163,.5);}
.screen .bezel.back .panel{filter:brightness(.6);}
.screen .bezel{display:block;border-radius:9px;padding:4px;background:#050102;box-shadow:0 0 0 1px rgba(255,255,255,.16),0 16px 34px rgba(0,0,0,.45);}
.screen .panel{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:6px;background:radial-gradient(90% 70% at 50% 40%,#2B0D33,#08020A 75%);overflow:hidden;}
.screen .panel img{width:68%;height:auto;opacity:.95;}
.screen .dim{position:absolute;font-family:var(--f-display);font-weight:700;color:#fff;font-variant-numeric:tabular-nums;line-height:1;}
.screen .dim.w{left:50%;top:calc(100% + 10px);transform:translateX(-50%);}
.screen .dim.h{top:50%;left:calc(100% + 10px);transform:translateY(-50%);}

/* scelta interno / esterno */
.overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,1,2,.66);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
.sheet{width:100%;max-width:560px;background:var(--sheet);border:1px solid var(--line);border-bottom:none;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));}
@media (min-width:640px){ .overlay{align-items:center;} .sheet{border-radius:26px;border-bottom:1px solid var(--line);} }
.sheet h3{font-size:1.25rem;font-weight:700;}
.sheet p{color:var(--dim);margin:6px 0 18px;}
.choice2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:18px;border-radius:18px;border:1.5px solid var(--line);background:var(--glass);text-align:left;transition:transform 160ms var(--ease-out),border-color 150ms ease,background-color 150ms ease;}
.choice:hover{border-color:var(--line-strong);}
.choice:active{transform:scale(.98);}
.choice.on{border-color:#fff;background:var(--glass-2);}
.choice svg{width:30px;height:30px;}
.choice strong{font-family:var(--f-display);font-size:1.05rem;font-weight:600;}
.choice small{color:var(--dim);font-size:.85rem;line-height:1.35;}
.sheet .close{margin-top:14px;width:100%;}

/* palco: l'offerta per il cliente */
.stage-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.stage-top .tools{display:flex;gap:8px;flex-wrap:wrap;}
.seg{display:inline-flex;padding:4px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.18);}
.seg button{min-height:36px;padding:0 14px;border:none;border-radius:999px;background:transparent;font-weight:600;font-size:.88rem;color:var(--dim);transition:background-color 150ms ease,color 150ms ease;}
.seg button.on{background:#fff;color:var(--on-white);}
.show-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-block:22px 26px;}
.show-head .lockup{font-size:clamp(1.9rem,6.4vw,3rem);}
.show-head .what{font-family:var(--f-display);font-weight:600;font-size:clamp(1rem,2.2vw,1.2rem);color:var(--dim);margin-top:6px;}
.show-head .what b{color:#fff;font-weight:700;}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:stretch;}
.plan{position:relative;display:flex;flex-direction:column;padding:22px 22px 24px;border-radius:28px;border:1.5px solid rgba(255,255,255,.2);background:radial-gradient(120% 60% at 50% 0%,rgba(109,64,163,.26),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 24px 50px rgba(5,1,2,.45);overflow:hidden;}
.plan .tier{display:flex;gap:5px;justify-content:center;}
.plan .tier i{width:22px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);}
.plan .tier i.r,.plan .tier i.g,.plan .tier i.b{background:var(--violet-hi);box-shadow:0 0 10px rgba(164,127,221,.55);}
.plan .pic{display:flex;justify-content:center;align-items:flex-end;min-height:190px;padding:14px 46px 34px 0;}
.plan .pic.dbl{padding-top:26px;padding-left:44px;}
.bif{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 9px;border-radius:999px;background:rgba(109,64,163,.38);border:1px solid rgba(164,127,221,.6);color:#fff;font-family:var(--f-display);font-weight:700;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;line-height:1;white-space:nowrap;}
.bif svg{width:16px;height:16px;flex:none;}
.plan .bif{align-self:center;margin-top:12px;}
.preview .plan .bif{display:none;}
.preview .plan .pic.dbl{padding-top:12px;padding-left:20px;}
.switch-row{display:flex;align-items:center;gap:14px;margin-top:12px;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--glass);cursor:pointer;transition:border-color 150ms ease,background-color 150ms ease;}
.switch-row:hover{border-color:var(--line-strong);}
.switch-row:has(input:checked){border-color:var(--violet-hi);background:rgba(109,64,163,.16);}
.switch-row input{position:absolute;opacity:0;width:1px;height:1px;}
.switch-row .sw{position:relative;flex:none;width:46px;height:28px;border-radius:999px;background:rgba(255,255,255,.16);transition:background-color 180ms ease;}
.switch-row .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform 200ms var(--ease-out);}
.switch-row input:checked + .sw{background:var(--violet);}
.switch-row input:checked + .sw::after{transform:translateX(18px);}
.switch-row input:focus-visible + .sw{outline:2px solid var(--violet-hi);outline-offset:3px;}
.switch-row strong{display:block;font-family:var(--f-display);font-weight:600;}
.switch-row small{display:block;color:var(--dim);font-size:.85rem;line-height:1.35;}
.switch-row .ico2{width:30px;height:30px;flex:none;margin-left:auto;opacity:.85;}
.show-head .bif{font-size:.8rem;padding:6px 13px 6px 10px;}
.plan h3{text-align:center;font-size:clamp(1.6rem,2.6vw,2.1rem);font-weight:700;letter-spacing:.02em;margin-top:4px;}
.plan ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px;flex:1;align-content:start;}
.plan li{position:relative;padding-left:16px;font-family:var(--f-display);font-weight:600;font-size:.88rem;line-height:1.35;}
.plan li::before{content:"";position:absolute;left:2px;top:.55em;width:5px;height:5px;border-radius:50%;background:#fff;}
.plan li.extra::before{background:var(--violet-hi);}
.price{margin-top:18px;display:grid;justify-items:end;gap:0;padding-right:4px;}
.price .list{position:relative;font-family:var(--f-display);font-weight:700;font-size:1.25rem;color:rgba(255,255,255,.85);font-variant-numeric:tabular-nums;}
.price .list::after{content:"";position:absolute;left:-6%;right:-6%;top:52%;height:3px;border-radius:2px;background:var(--strike);transform:rotate(-4deg);}
.price .final{font-family:var(--f-display);font-weight:700;font-size:clamp(2.6rem,4.6vw,3.6rem);line-height:1.02;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.price .final span{font-size:.62em;margin-right:.14em;}
.price .per{font-family:var(--f-display);font-weight:600;font-size:.86rem;letter-spacing:.04em;color:var(--dim);}
.foot-note{text-align:center;color:var(--faint);font-size:.82rem;margin-top:22px;}

/* banco del venditore: offerta personalizzata */
.builder{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:28px;align-items:start;margin-top:18px;}
.steps{display:grid;gap:16px;}
.step{padding:20px;border-radius:22px;background:var(--glass);border:1px solid var(--line);}
.step-h{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.step-h .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.9rem;background:var(--violet);color:#fff;flex:none;}
.step-h h2{font-size:1.08rem;font-weight:600;}
.step-h small{display:block;color:var(--dim);font-size:.85rem;font-family:var(--f-body);font-weight:400;}
.dims{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end;}
.field{display:grid;gap:6px;}
.field label{font-size:.85rem;color:var(--dim);font-weight:500;}
.in{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:rgba(0,0,0,.2);font-size:1.05rem;font-variant-numeric:tabular-nums;}
.in:focus{border-color:#fff;outline:none;}
.in-unit{position:relative;}
.in-unit .in{padding-right:44px;}
.in-unit span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:.9rem;pointer-events:none;}
.dims .x{padding-bottom:12px;color:var(--faint);font-size:1.2rem;}
.hint{color:var(--dim);font-size:.86rem;margin:10px 0 0;}
.hint.warn{color:var(--warn);}
.preset-pick{margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:rgba(109,64,163,.18);border:1px solid rgba(164,127,221,.4);font-size:.9rem;}
.tabs{display:flex;gap:6px;margin-bottom:12px;}
.tabs button{flex:1;min-height:42px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-family:var(--f-display);font-weight:600;font-size:.9rem;}
.tabs button.on{background:#fff;color:var(--on-white);border-color:#fff;}
.acc-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;}
.acc{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:12px;background:rgba(0,0,0,.18);border:1px solid var(--line);}
.acc span{flex:1;min-width:0;font-size:.94rem;}
.acc .rm{width:34px;height:34px;flex:none;border-radius:9px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;}
.acc .rm svg{width:16px;height:16px;}
.search{position:relative;margin-top:12px;}
.search .in{padding-left:42px;}
.search-row{display:flex;gap:10px;align-items:flex-start;margin-top:12px;}
.search-row .search{flex:1;min-width:0;margin-top:0;}
.search-row .tbtn{min-height:48px;border-radius:12px;}
.search > svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:.6;pointer-events:none;}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;list-style:none;margin:0;padding:6px;border-radius:14px;background:var(--sheet);border:1px solid var(--line-strong);box-shadow:0 18px 40px rgba(0,0,0,.45);max-height:260px;overflow:auto;}
.sugg li button{width:100%;text-align:left;min-height:42px;padding:8px 12px;border:none;border-radius:10px;background:transparent;font-size:.94rem;}
.sugg li button:hover,.sugg li button.act{background:var(--glass-2);}
.sugg li button mark{background:none;color:#fff;font-weight:700;text-decoration:underline;text-underline-offset:3px;}
.sugg li button small{color:var(--faint);margin-left:6px;}
.prices{display:grid;gap:12px;}
.price-row{display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:end;}
.price-row .pl{font-family:var(--f-display);font-weight:700;padding-bottom:12px;}
.price-row .disc{grid-column:2 / -1;font-size:.82rem;color:var(--dim);margin-top:-4px;}
.price-row .disc.bad{color:var(--warn);}
.sugg-p{grid-column:2 / -1;justify-self:start;display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 12px 6px 10px;border-radius:999px;border:1.5px solid rgba(164,127,221,.6);background:rgba(109,64,163,.22);color:#fff;font-size:.85rem;font-weight:600;margin-top:-2px;transition:transform 140ms var(--ease-out),background-color 150ms ease;}
.sugg-p:hover{background:rgba(109,64,163,.38);}
.sugg-p:active{transform:scale(.97);}
.sugg-p b{font-variant-numeric:tabular-nums;}
.sugg-p small{font-weight:500;color:var(--dim);font-size:.78rem;}
.sugg-p[hidden]{display:none;}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
.preview{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));padding:16px;border-radius:24px;border:1px solid var(--line);background:rgba(5,1,2,.35);}
.preview h2{font-size:.95rem;font-weight:600;color:var(--dim);margin-bottom:10px;}
.preview .plans{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.preview .plan{padding:10px 8px 12px;border-radius:16px;border-width:1.5px;box-shadow:none;}
.preview .plan .pic{min-height:84px;padding:6px 18px 18px 0;}
.preview .plan h3{font-size:.95rem;}
.preview .plan ul{gap:4px;margin-top:8px;}
.preview .plan li{font-size:.62rem;padding-left:9px;}
.preview .plan li::before{width:3px;height:3px;left:1px;}
.preview .price .list{font-size:.72rem;}
.preview .price .final{font-size:1.35rem;}
.preview .price .per{font-size:.56rem;}
.preview .tier i{width:12px;height:3px;}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:60;background:#fff;color:var(--on-white);font-weight:600;padding:11px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:opacity 200ms ease,transform 200ms var(--ease-out);}
.toast.show{opacity:1;transform:translate(-50%,0);}

@media (prefers-reduced-motion:no-preference){
  .view-in{animation:viewIn 260ms var(--ease-out);}
  .plans.reveal .plan{animation:planIn 520ms var(--ease-out) both;}
  .plans.reveal .plan:nth-child(2){animation-delay:70ms;}
  .plans.reveal .plan:nth-child(3){animation-delay:140ms;}
  .overlay{animation:fade 180ms ease;}
  .sheet{animation:sheetIn 280ms cubic-bezier(.32,.72,0,1);}
}
@keyframes viewIn{from{opacity:.0;transform:translateY(6px);}}
@keyframes planIn{from{opacity:0;transform:translateY(14px) scale(.98);}}
@keyframes fade{from{opacity:0;}}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0;}}

@media (max-width:980px){
  .builder{grid-template-columns:minmax(0,1fr);}
  .preview{position:static;}
}
@media (max-width:820px){
  .sizes{grid-template-columns:minmax(0,1fr);}
  .size-card{flex-direction:row;justify-content:space-between;text-align:left;padding:18px 20px;}
  .size-card .stage{height:96px;order:2;}
  .size-card .txt{order:1;}
  .plans{grid-template-columns:minmax(0,1fr);gap:18px;}
  .plan .pic{min-height:160px;}
}
@media (max-width:520px){
  .wrap{padding-inline:16px;}
  .custom-card{grid-template-columns:auto 1fr;}
  .custom-card .go{display:none;}
  .price-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
  .price-row .pl{grid-column:1 / -1;padding-bottom:0;}
  .price-row .disc{grid-column:1 / -1;}
  .sugg-p{grid-column:1 / -1;}
  .saved-item{grid-template-columns:minmax(0,1fr);}
  .saved-item .mini-screen{display:none;}
  .saved-item .acts{justify-content:flex-start;}
  .choice2{grid-template-columns:minmax(0,1fr);}
}
</style>
</head>

/* ===== salvataggio sul dispositivo (le offerte personalizzate del venditore) ===== */
const KEY = 'jse-preventivi-offerte';
function migrate(o){
  if (!o || o.spotV === 2 || !Array.isArray(o.plans)) return false;
  o.plans.forEach(pl => {
    const f = (pl.features || []).map(x => x === OLD_SPOT ? SPOT : x).filter((x, i, a) => a.indexOf(x) === i);
    if (f.indexOf(SPOT) < 0){ const at = f.indexOf('Assicurazione RCT'); f.splice(at > -1 ? at + 1 : f.length, 0, SPOT); }
    pl.features = f;
  });
  o.spotV = 2; return true;
}
function loadSaved(){
  try {
    const v = JSON.parse(localStorage.getItem(KEY) || '[]'); if (!Array.isArray(v)) return [];
    if (v.map(migrate).some(Boolean)) storeSaved(v);
    return v;
  } catch (e){ return []; }
}
function storeSaved(list){ try { localStorage.setItem(KEY, JSON.stringify(list)); return true; } catch (e){ return false; } }

/* ===== modello di un'offerta ===== */
function fromPreset(pr, env){
  const t = pr[env];
  return { kind:'preset', presetId: pr.id, env, orient:'v', w: pr.w, h: pr.h, spotV:2,
    plans: PLANS.map(P => ({ id:P.id, features: DEFAULT_FEATURES[P.id].slice(), list: t[P.id][0], final: t[P.id][1] })) };
}
function blankOffer(){
  return { kind:'custom', id: uid(), env:null, orient:null, w:null, h:null, spotV:2,
    plans: PLANS.map(P => ({ id:P.id, features: DEFAULT_FEATURES[P.id].slice(), list:null, final:null })) };
}
const sizeLabel = o => (o.w && o.h) ? cm(o.w) + ' × ' + cm(o.h) + ' cm' : 'misure da scegliere';
const BIF = '<span class="bif"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="12" height="14" rx="2" opacity=".55"/><rect x="9" y="7" width="12" height="14" rx="2" fill="rgba(109,64,163,.9)"/></svg>Bifacciale</span>';

/* ===== disegno dello schermo con le misure ===== */
function screenHTML(w, h, maxBox, labels, dbl){
  w = w || 50; h = h || 75;
  const k = maxBox / Math.max(w, h), W = Math.max(26, Math.round(w*k)), H = Math.max(26, Math.round(h*k));
  const face = cls => '<span class="bezel' + cls + '" style="width:' + W + 'px;height:' + H + 'px"><span class="panel"><img src="' + LOGO + '" alt=""></span></span>';
  return '<span class="screen"' + (dbl ? ' title="Insegna bifacciale: schermo su entrambi i lati"' : '') + '>' + (dbl ? face(' back') : '') + face('') +
    (labels ? '<span class="dim w" style="font-size:' + labels + 'px">' + esc(cm(w)) + '</span><span class="dim h" style="font-size:' + labels + 'px">' + esc(cm(h)) + '</span>' : '') + '</span>';
}

/* ===== i tre piani (stesso disegno per il cliente e per l'anteprima) ===== */
function plansHTML(o, compact){
  const w = o.w || 50, h = o.h || 75;   // base × altezza così come sono state scelte
  return PLANS.map(P => {
    const pl = o.plans.find(x => x.id === P.id), defs = DEFAULT_FEATURES[P.id];
    return '<article class="plan" aria-label="Piano ' + P.name + '">' +
      '<div class="tier" aria-hidden="true">' + ['r','g','b'].map((c, i) => '<i class="' + (i < P.tier ? c : '') + '"></i>').join('') + '</div>' +
      (o.double ? BIF : '') +
      '<div class="pic' + (o.double ? ' dbl' : '') + '">' + screenHTML(w, h, compact ? 62 : 150, compact ? 11 : 26, o.double) + '</div>' +
      '<h3>' + P.name + '</h3>' +
      '<ul>' + (pl.features.length ? pl.features.map(f => '<li' + (defs.indexOf(f) < 0 ? ' class="extra"' : '') + '>' + esc(f) + '</li>').join('') : '<li>Nessun accessorio</li>') + '</ul>' +
      '<div class="price">' + (pl.list != null ? '<span class="list">€' + money(pl.list) + '</span>' : '') +
        '<span class="final"><span>€</span>' + money(pl.final) + '</span><span class="per">/MESE + IVA</span>' +
        '</div>' +
    '</article>';
  }).join('');
}

/* ===== navigazione ===== */
let view = 'home', current = null, editing = null;
function go(v, data){
  view = v; modal.innerHTML = ''; window.scrollTo(0, 0);
  if (v === 'home') renderHome();
  else if (v === 'show') renderShow(data);
  else if (v === 'build') renderBuild(data);
  app.classList.remove('view-in'); void app.offsetWidth; app.classList.add('view-in');
}

/* ===== schermata iniziale ===== */

  const saved = loadSaved();
  const minPrice = pr => Math.min(pr.int.base[1], pr.ext.base[1]);
  app.innerHTML =
    '<section class="hero"><h1 class="lockup" aria-label="Horizon Offers">' + LOCKUP + '</h1><span class="rule" aria-hidden="true"></span><p>Le offerte per le insegne LED: scegli una misura pronta da mostrare al cliente oppure prepara un\'offerta su misura.</p>' + COLLAB + '</section>' +
    '<div class="sec-title"><h2>Misure pronte</h2><small>Interno o esterno lo scegli dopo</small></div>' +
    '<div class="sizes">' + PRESETS.map(pr => '<button type="button" class="size-card" data-preset="' + pr.id + '"><span class="stage">' + screenHTML(pr.w, pr.h, 96, 0) + '</span><span class="txt"><strong>' + pr.w + ' × ' + pr.h + '<span>cm</span></strong><br><span class="from">da <b>€ ' + money(minPrice(pr)) + '</b> al mese + IVA</span></span></button>').join('') + '</div>' +
    '<button type="button" class="custom-card" id="custom"><span class="plus">' + ICON.plus + '</span><span><h3>Crea un\'offerta personalizzata</h3><p>Interno o esterno, orientamento, misure, accessori e prezzi dei tre piani.</p></span><span class="go">' + ICON.arrow + '</span></button>' +
    (saved.length ? '<section class="saved"><div class="sec-title"><h2>Offerte salvate</h2><small>Su questo dispositivo</small></div><ul class="saved-list">' + saved.map(o =>
      '<li class="saved-item"><span class="mini-screen">' + screenHTML(o.w, o.h, 44, 0, o.double) + '</span><span class="meta"><strong>' + esc(sizeLabel(o)) + '</strong><small>' + (o.env ? ENV[o.env].label : '') + ', ' + (o.orient === 'h' ? 'orizzontale' : 'verticale') + (o.double ? ', bifacciale' : '') + '</small></span>' +
      '<span class="acts"><button class="mini-btn" data-show="' + o.id + '">Mostra</button><button class="mini-btn" data-edit="' + o.id + '">Modifica</button><button class="mini-btn danger" data-del="' + o.id + '">Elimina</button></span></li>').join('') + '</ul></section>' : '');
  $$('[data-preset]').forEach(b => b.onclick = () => askEnv(env => go('show', fromPreset(PRESETS.find(p => p.id === b.dataset.preset), env))));
  $('#custom').onclick = () => go('build', blankOffer());
  $$('[data-show]').forEach(b => b.onclick = () => { const o = loadSaved().find(x => x.id === b.dataset.show); if (o) go('show', o); });
  $$('[data-edit]').forEach(b => b.onclick = () => { const o = loadSaved().find(x => x.id === b.dataset.edit); if (o) go('build', JSON.parse(JSON.stringify(o))); });
  $$('[data-del]').forEach(b => b.onclick = () => confirmSheet('Eliminare questa offerta?', 'Viene tolta solo da questo dispositivo.', 'Elimina', () => { storeSaved(loadSaved().filter(x => x.id !== b.dataset.del)); toast('Offerta eliminata'); go('home'); }));

/* ===== finestre ===== */
function sheet(html){ modal.innerHTML = '<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true">' + html + '</div></div>'; $('#ov').onclick = e => { if (e.target.id === 'ov') modal.innerHTML = ''; }; }
function askEnv(cb){
  sheet('<h3>Dove va l\'insegna?</h3><p>Il listino cambia tra interno ed esterno.</p><div class="choice2">' +
    '<button class="choice" data-env="int">' + ICON.shop + '<strong>Interno</strong><small>In vetrina o dentro il locale</small></button>' +
    '<button class="choice" data-env="ext">' + ICON.sun + '<strong>Esterno</strong><small>A parete, su palo o totem fuori dal locale</small></button></div>' +
    '<button class="tbtn close" id="sh-x">Annulla</button>');
  $$('[data-env]', modal).forEach(b => b.onclick = () => { modal.innerHTML = ''; cb(b.dataset.env); });
  $('#sh-x').onclick = () => { modal.innerHTML = ''; };
}
function confirmSheet(title, text, ok, cb){
  sheet('<h3>' + esc(title) + '</h3><p>' + esc(text) + '</p><div class="actions"><button class="tbtn" id="c-no">Annulla</button><button class="tbtn solid" id="c-ok">' + esc(ok) + '</button></div>');
  $('#c-no').onclick = () => { modal.innerHTML = ''; }; $('#c-ok').onclick = () => { modal.innerHTML = ''; cb(); };
}

/* ===== palco per il cliente ===== */

  current = o;
  const isPreset = o.kind === 'preset';
  const orientTxt = o.orient === 'h' ? 'orizzontale' : 'verticale';
  app.innerHTML =
    '<div class="stage-top"><button class="tbtn" id="back">' + ICON.back + 'Home</button><div class="tools">' +
      (isPreset ? '<div class="seg" role="group" aria-label="Interno o esterno"><button data-env="int"' + (o.env === 'int' ? ' class="on"' : '') + '>Interno</button><button data-env="ext"' + (o.env === 'ext' ? ' class="on"' : '') + '>Esterno</button></div>' : '') +
      '<button class="tbtn" id="edit">' + ICON.edit + 'Modifica</button>' +
      '<button class="tbtn" id="pdf">' + ICON.down + 'Scarica PDF</button><button class="tbtn" id="fs">' + ICON.full + 'Schermo intero</button></div></div>' +
    '<header class="show-head"><p class="lockup" role="img" aria-label="Horizon Offers">' + LOCKUP + '</p>' + COLLAB + '<p class="what">Insegna LED ' + (o.double ? 'bifacciale ' : '') + ENV[o.env].long + ' <b>' + esc(sizeLabel(o)) + '</b>' + (isPreset ? '' : ', ' + orientTxt) + '</p>' + (o.double ? BIF.replace('Bifacciale', 'Bifacciale: schermo su entrambi i lati') : '') + '</header>' +
    '<section class="plans reveal" aria-label="I tre piani">' + plansHTML(o, false) + '</section>' +
    '<p class="foot-note">Canone mensile, IVA esclusa.</p>';
  $('#back').onclick = () => { exitFull(); go('home'); };
  $$('[data-env]').forEach(b => b.onclick = () => { if (o.env !== b.dataset.env) go('show', fromPreset(PRESETS.find(p => p.id === o.presetId), b.dataset.env)); });
  $('#edit').onclick = () => {
    const copy = JSON.parse(JSON.stringify(o));
    if (copy.kind === 'preset'){ copy.kind = 'custom'; copy.id = uid(); copy.fromPreset = copy.presetId; delete copy.presetId; toast('Modifichi una copia: il listino pronto resta com\'è'); }
    go('build', copy);
  };
  $('#pdf').onclick = () => downloadPDF(o);
  $('#fs').onclick = () => {
    const d = document.documentElement;
    if (document.fullscreenElement){ exitFull(); return; }
    if (d.requestFullscreen) d.requestFullscreen().catch(() => toast('Schermo intero non disponibile qui'));
    else toast('Schermo intero non disponibile qui');
  };
}
function exitFull(){ try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e){} }

/* ===== banco del venditore: offerta personalizzata ===== */

  const choice = (key, val, icon, title, sub) => '<button type="button" class="choice' + (o[key] === val ? ' on' : '') + '" data-k="' + key + '" data-v="' + val + '">' + icon + '<strong>' + title + '</strong><small>' + sub + '</small></button>';

        '<div class="tabs" role="tablist">' + PLANS.map(P => '<button type="button" role="tab" data-tab="' + P.id + '">' + P.name + '</button>').join('') + '</div>' +
        '<ul class="acc-list" id="acc-list"></ul>' +
        '<div class="search-row"><div class="search">' + ICON.search + '<input class="in" id="acc-q" type="text" autocomplete="off" placeholder="Cerca o scrivi un nuovo accessorio" aria-label="Cerca o crea un accessorio" aria-autocomplete="list" aria-controls="acc-sugg"><ul class="sugg" id="acc-sugg" role="listbox" hidden></ul></div><button type="button" class="tbtn" id="acc-new">' + ICON.plus + 'Crea</button></div>' +

        PLANS.map(P => { const pl = o.plans.find(x => x.id === P.id); return '<div class="price-row"><span class="pl">' + P.name + '</span>' +
          '<div class="field"><label for="pl-' + P.id + '">Listino</label><div class="in-unit"><input class="in" id="pl-' + P.id + '" data-p="' + P.id + '" data-f="list" inputmode="decimal" autocomplete="off" placeholder="Es. 90" value="' + (pl.list != null ? cm(pl.list) : '') + '"><span>€</span></div></div>' +
          '<div class="field"><label for="pf-' + P.id + '">Prezzo finale</label><div class="in-unit"><input class="in" id="pf-' + P.id + '" data-p="' + P.id + '" data-f="final" inputmode="decimal" autocomplete="off" placeholder="Es. 81" value="' + (pl.final != null ? cm(pl.final) : '') + '"><span>€</span></div></div>' +
          '<span class="disc" id="disc-' + P.id + '"></span><button type="button" class="sugg-p" id="sg-' + P.id + '" data-sg="' + P.id + '" hidden></button></div>'; }).join('') + '</div></section>' +
      '<div class="actions"><button class="tbtn" id="b-pdf">' + ICON.down + 'Scarica PDF</button><button class="tbtn" id="save">Salva offerta</button><button class="tbtn solid" id="present">Mostra al cliente' + ICON.arrow + '</button></div>' +
    '</div>' +
    '<aside class="preview" aria-label="Anteprima"><h2>Anteprima per il cliente</h2><div class="plans" id="pv"></div></aside></div>';

  const refreshPreview = () => { $('#pv').innerHTML = plansHTML(o, true); };
  const dimHint = () => {
    const el = $('#dim-hint'); el.className = 'hint';
    if (!o.w || !o.h){ el.textContent = 'Scrivi base e altezza dell\'insegna.'; return; }
    const isH = o.w > o.h, isV = o.h > o.w;
    if (o.orient === 'v' && isH){ el.className = 'hint warn'; el.textContent = 'Con queste misure l\'insegna è più larga che alta: controlla l\'orientamento.'; }
    else if (o.orient === 'h' && isV){ el.className = 'hint warn'; el.textContent = 'Con queste misure l\'insegna è più alta che larga: controlla l\'orientamento.'; }
    else el.textContent = 'Superficie ' + cm(Math.round(o.w*o.h/100)/100) + ' m².';
    // stessa misura di un listino pronto: si possono riprendere i prezzi
    const pr = PRESETS.find(p => (p.w === Math.min(o.w, o.h) && p.h === Math.max(o.w, o.h)));
    const box = $('#preset-pick');
    if (pr && o.env){ box.innerHTML = '<div class="preset-pick"><span>È la misura del listino ' + pr.w + ' × ' + pr.h + '.' + (o.double ? ' I listini pronti sono per insegne a una faccia: per la bifacciale controlla i prezzi.' : '') + '</span><button class="mini-btn" id="use-pr">Usa i prezzi del listino ' + ENV[o.env].label.toLowerCase() + '</button></div>';
      $('#use-pr').onclick = () => { PLANS.forEach(P => { const pl = o.plans.find(x => x.id === P.id); pl.list = pr[o.env][P.id][0]; pl.final = pr[o.env][P.id][1]; $('#pl-' + P.id).value = cm(pl.list); $('#pf-' + P.id).value = cm(pl.final); }); prices(); refreshPreview(); toast('Prezzi del listino inseriti'); }; }
    else box.innerHTML = '';
  };
  // prezzo finale suggerito: listino meno il 10% (arrotondato all'euro), da approvare
  const SUGG_DISC = .10;
  const suggOf = list => list == null || !(list > 0) ? null : (list >= 10 ? Math.round(list*(1 - SUGG_DISC)) : Math.round(list*(1 - SUGG_DISC)*100)/100);
  // e al contrario: listino suggerito = prezzo finale più l'11% (arrotondato all'euro)
  const SUGG_UP = .11;
  const listOf = fin => fin == null || !(fin > 0) ? null : (fin >= 10 ? Math.round(fin*(1 + SUGG_UP)) : Math.round(fin*(1 + SUGG_UP)*100)/100);
  const lastEdit = {};   // per ogni piano: quale campo è stato scritto per ultimo ('list' o 'final')
  const listSugg = pl => lastEdit[pl.id] === 'final' ? listOf(pl.final) : null;
  const useList = id => { const pl = o.plans.find(x => x.id === id), v = listOf(pl.final); if (v == null) return; pl.list = v; $('#pl-' + id).value = cm(v); prices(); refreshPreview(); toast('Listino: € ' + money(v) + ' (+11%)'); };
  const useSugg = id => { const pl = o.plans.find(x => x.id === id), v = suggOf(pl.list); if (v == null) return; pl.final = v; $('#pf-' + id).value = cm(v); prices(); refreshPreview(); toast('Prezzo finale: € ' + money(v) + ' (sconto 10%)'); };
  // quando si crea l'offerta: il listino vuoto si riempie da solo con il prezzo finale più l'11%
  const fillLists = () => o.plans.forEach(pl => { if (pl.list == null && pl.final != null){ const v = listOf(pl.final); if (v != null){ pl.list = v; const el = $('#pl-' + pl.id); if (el) el.value = cm(v); } } });
  const prices = () => PLANS.forEach(P => {
    const pl = o.plans.find(x => x.id === P.id), el = $('#disc-' + P.id); el.className = 'disc';
    const sg = suggOf(pl.list), ls = listSugg(pl), b = $('#sg-' + P.id), fin = $('#pf-' + P.id), lst = $('#pl-' + P.id);
    fin.placeholder = sg != null ? cm(sg) : 'Es. 81';
    lst.placeholder = listOf(pl.final) != null ? cm(listOf(pl.final)) : 'Es. 90';
    if (ls != null){
      b.dataset.mode = 'list'; b.hidden = pl.list === ls;
      if (!b.hidden) b.innerHTML = 'Listino suggerito: <b>€ ' + money(ls) + '</b><small>+11%</small> · Usa';
    } else {
      b.dataset.mode = 'final'; b.hidden = sg == null || pl.final === sg;
      if (!b.hidden) b.innerHTML = 'Suggerito: <b>€ ' + money(sg) + '</b><small>sconto 10%</small> · Usa';
    }
    if (pl.list != null && pl.final != null){
      if (pl.final > pl.list){ el.className = 'disc bad'; el.textContent = 'Il prezzo finale è più alto del listino.'; }
      else el.textContent = pl.final < pl.list ? 'Sconto del ' + Math.round((1 - pl.final/pl.list)*100) + '% sul listino' : 'Nessuno sconto sul listino';
    } else el.textContent = '';
  });
  const renderAcc = () => {
    $$('[data-tab]').forEach(b => { const on = b.dataset.tab === tab; b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false'); });
    const pl = o.plans.find(x => x.id === tab);
    $('#acc-list').innerHTML = pl.features.length ? pl.features.map((f, i) => '<li class="acc"><span>' + esc(f) + '</span><button class="rm" data-rm="' + i + '" aria-label="Togli ' + esc(f) + '">' + ICON.x + '</button></li>').join('') : '<li class="hint">Nessun accessorio in questo piano.</li>';
    $$('[data-rm]').forEach(b => b.onclick = () => { pl.features.splice(+b.dataset.rm, 1); renderAcc(); refreshPreview(); });
  };
  // ricerca con elenco a discesa
  const q = $('#acc-q'), sugg = $('#acc-sugg'); let act = -1, items = [];
  const addFeat = (f, created) => { f = f.trim().replace(/\s+/g, ' '); if (!f) return; if (created) rememberAccessory(f); const pl = o.plans.find(x => x.id === tab); if (pl.features.indexOf(f) < 0){ pl.features.push(f); toast((created ? 'Creato e aggiunto a ' : 'Aggiunto a ') + PLANS.find(P => P.id === tab).name); } else toast('È già in questo piano'); q.value = ''; closeSugg(); renderAcc(); refreshPreview(); q.focus(); };
  const closeSugg = () => { sugg.hidden = true; act = -1; };
  const showSugg = () => {
    const t = q.value.trim().toLowerCase(), pl = o.plans.find(x => x.id === tab);
    if (!t){ closeSugg(); return; }
    const cat = catalog();
    items = cat.filter(c => c.toLowerCase().indexOf(t) > -1).map(c => ({ v:c, have: pl.features.indexOf(c) > -1 }));
    const exact = cat.some(c => c.toLowerCase() === t);
    if (!exact) items.push({ v:q.value.trim(), custom:true });
    sugg.innerHTML = items.map((it, i) => {
      const lab = it.custom ? 'Crea l\'accessorio «' + esc(it.v) + '»' : esc(it.v).replace(new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'i'), '<mark>$1</mark>');

async function downloadPDF(o){
  if (!window.jspdf || !window.jspdf.jsPDF){ toast('Non riesco a creare il PDF: controlla la connessione e riprova'); return; }
  toast('Preparo il PDF…');
  try {
    const cv = await drawOfferCanvas(o);
    const doc = new window.jspdf.jsPDF({ orientation:'landscape', unit:'px', format:[1920, 1080], hotfixes:['px_scaling'], compress:true });
    doc.addImage(cv.toDataURL('image/jpeg', .92), 'JPEG', 0, 0, 1920, 1080);
    const blob = doc.output('blob');
    const name = 'Horizon_Offers_' + ENV[o.env].label + (o.double ? '_Bifacciale' : '') + '_' + cm(o.w) + 'x' + cm(o.h) + '_' + new Date().toISOString().slice(0, 10) + '.pdf';
    if (downloads) await downloads.save({ filename: name, data: blob });
    else {
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = name; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }
    toast('PDF scaricato');
  } catch (e){
    const code = e && e.code;
    if (code === 'declined') toast('Download annullato');
    else if (code === 'rate_limited') toast('Conferma il download già aperto');
    else { console.error(e); toast('Non riesco a creare il PDF. Riprova.'); }
  }
}

function start(){
  let q = null;
  try { q = new URLSearchParams(location.search); } catch (e){}
  const w = q && num(q.get('w')), h = q && num(q.get('h'));
  if (!w || !h || w <= 0 || h <= 0 || w > 2000 || h > 2000){ go('home'); return; }
  const env = q.get('env') === 'ext' ? 'ext' : (q.get('env') === 'int' ? 'int' : null), fromRender = q.get('from') === 'render';
  try { history.replaceState(null, '', location.pathname); } catch (e){}   // un ricaricamento riporta alla home
  const pr = PRESETS.find(p => p.w === w && p.h === h);                     // misura pronta, stesso orientamento
  if (pr){
    if (env) go('show', fromPreset(pr, env));
    else { go('home'); askEnv(e => go('show', fromPreset(pr, e))); }
  } else {
    const o = blankOffer(); o.w = w; o.h = h; o.orient = w > h ? 'h' : 'v'; o.env = env;
    go('build', o);
  }
  if (fromRender) setTimeout(() => toast('Misure prese da Horizon Render: ' + cm(w) + ' × ' + cm(h) + ' cm'), 350);
}
